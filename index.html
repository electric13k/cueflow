<!doctype html>
<!-- No `class="dark"` here. The page is beige and has been since there stopped being a page-wide
     mode; main.tsx calls applyTheme("light") on boot, so the class was only ever a dark first paint
     that flipped to cream a frame later. Dark is a scope now, on a wrapper, never on this element. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the docked transport can sit on the screen edge and pad itself past
         the home indicator with env(safe-area-inset-bottom) instead of floating above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CueFlow: browser soundboard & cue system</title>
    <meta name="description" content="A browser soundboard, Web Audio editor and arrow-key cue system for theatre, presentations and streams." />
    <link rel="canonical" href="https://cuefloww.netlify.app/" />

    <!-- The mark: a Bodoni C with the standby lamp sitting in its mouth. The SVG is what modern
         browsers take; the .ico carries 16/32/48 for the ones that still ask for it. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Two of these, because the browser chrome should match the house lights, not fight them. -->
    <meta name="theme-color" content="#EFE7D8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1614" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CueFlow" />
    <meta property="og:url" content="https://cuefloww.netlify.app/" />
    <meta property="og:title" content="CueFlow: browser soundboard & cue system" />
    <meta property="og:description" content="A browser soundboard, Web Audio editor and arrow-key cue system for theatre, presentations and streams." />
    <meta property="og:image" content="https://cuefloww.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A maroon playbill card: the CueFlow monogram, a cream Bodoni C with a brass cue lamp in its mouth, above the wordmark CueFlow." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CueFlow: browser soundboard & cue system" />
    <meta name="twitter:description" content="A browser soundboard, Web Audio editor and arrow-key cue system for theatre, presentations and streams." />
    <meta name="twitter:image" content="https://cuefloww.netlify.app/og.png" />
    <meta name="twitter:image:alt" content="A maroon playbill card: the CueFlow monogram, a cream Bodoni C with a brass cue lamp in its mouth, above the wordmark CueFlow." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Bodoni for the playbill, Source Serif for the page, and Courier Prime because that is the
         font a script is actually typed in -- every cue number and timecode is set in it. -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700;6..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
