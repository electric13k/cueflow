<!doctype html>
<!-- Theme is applied before the app bundle so the dark default does not flash light on first paint.
     A saved light preference still wins for returning users. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const saved = localStorage.getItem("cueflow:theme:studio") || localStorage.getItem("cueflow:theme");
        const dark = saved !== "light";
        document.documentElement.classList.toggle("theme-dark", dark);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
    <!-- viewport-fit=cover so the docked transport can sit on the screen edge and pad itself past
         the home indicator with env(safe-area-inset-bottom) instead of floating above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CueFlow | Browser Soundboard and Cue System for Live Productions</title>
    <meta name="description" content="CueFlow is a browser-based soundboard, media library, script reader and cue system for theatre, presentations, classrooms and live productions." />
    <meta name="keywords" content="browser soundboard, theatre cues, live production software, cue system, script reader, Web Audio editor, audience display" />
    <meta name="author" content="CueFlow" />
    <meta name="application-name" content="CueFlow" />
    <link rel="canonical" href="https://cueflow.pages.dev/" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="CueFlow AI-readable summary" />

    <!-- The mark: a Bodoni C with the standby lamp sitting in its mouth. The SVG is what modern
         browsers take; the .ico carries 16/32/48 for the ones that still ask for it. -->
    <!-- The mark is a raster (public/brand/cf-dark.png), so there is no SVG favicon to prefer. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Two of these, because the browser chrome should match the house lights, not fight them. -->
    <meta name="theme-color" content="#EFE7D8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1614" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CueFlow" />
    <meta property="og:url" content="https://cueflow.pages.dev/" />
    <meta property="og:title" content="CueFlow | Browser Soundboard and Cue System for Live Productions" />
    <meta property="og:description" content="A browser-based soundboard, media library, script reader and cue system for theatre, presentations, classrooms and live productions." />
    <meta property="og:image" content="https://cueflow.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A maroon playbill card: the CueFlow monogram, a cream Bodoni C with a brass cue lamp in its mouth, above the wordmark CueFlow." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CueFlow | Browser Soundboard and Cue System for Live Productions" />
    <meta name="twitter:description" content="A browser-based soundboard, media library, script reader and cue system for theatre, presentations, classrooms and live productions." />
    <meta name="twitter:image" content="https://cueflow.pages.dev/og.png" />
    <meta name="twitter:image:alt" content="CueFlow dark-mode browser cue board for live productions." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CueFlow",
        "url": "https://cueflow.pages.dev/",
        "description": "A browser-based soundboard, media library, script reader and cue system for live productions.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web browser",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Browser soundboard and media library",
          "Theatre cue sequences",
          "Script reader with cue-word alerts",
          "Audience display and multi-device shows",
          "Web Audio editing for sound clips"
        ],
        "publisher": { "@type": "Organization", "name": "CueFlow", "url": "https://cueflow.pages.dev/" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Corbel for reading copy, Source Serif for controls, Bodoni for the playbill display, and
         Courier Prime because that is the font a script is actually typed in. -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700;6..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
