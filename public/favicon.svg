<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CueFloww">
  <title>CueFloww</title>
  <!-- The house tabs: a maroon plaque with a brass playbill rule, the way a prompt-desk
       nameplate is framed. Everything here is sized so it survives the 16px tab. -->
  <rect width="64" height="64" rx="14" fill="#8A2B35"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="10.5" fill="none" stroke="#D4A957" stroke-width="1.1" opacity=".38"/>
  <!-- MARK -->
  <!-- Didone C: outer circle r21, inner ellipse 13x18.4, so the bow is 8 units thick at the
       sides and 2.6 at the crown: Bodoni's contrast, not a uniform ring. Cut at 40deg and
       -28deg, ball terminal on top, sheared terminal below. -->
  <path d="M48.09 18.50A21 21 0 1 0 50.54 41.86L43.48 40.64A13 18.4 0 1 1 41.96 20.17Z" fill="#EFE7D8"/>
  <circle cx="45" cy="19.5" r="3.35" fill="#EFE7D8"/>
  <!-- The cue lamp, sitting in the mouth of the C where the standby light sits on a desk. -->
  <circle cx="49.2" cy="31" r="3.8" fill="#D4A957"/>
  <!-- /MARK -->
</svg>
