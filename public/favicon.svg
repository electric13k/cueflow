<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CueFloww">
  <title>CueFloww</title>
  <!-- The mark: a C that is also a proscenium arch, with a lantern hung at its crown and the beam
       falling onto the stage the counter encloses. Four shapes, no more: at 16 pixels a fifth one
       turns into dirt. -->
  <rect width="64" height="64" rx="14" fill="#F3E9D8"/>
  <clipPath id="cf-stage"><circle cx="32" cy="32" r="15"/></clipPath>
  <g clip-path="url(#cf-stage)">
    <path d="M32 17 L47 49 L17 49 Z" fill="#46583A" opacity=".92"/>
  </g>
  <path d="M44.01 16.63 A19.5 19.5 0 1 0 44.01 47.37" fill="none" stroke="#6E2029" stroke-width="9"/>
  <rect x="27" y="13.5" width="10" height="4.5" rx="1.6" fill="#2B2420"/>
</svg>
