<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-label="Cueflow abstract production graphic">
  <defs>
    <linearGradient id="bg-light-portrait" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4EEDF"/>
      <stop offset="1" stop-color="#FFF9EF"/>
    </linearGradient>
    <linearGradient id="gold-light-portrait" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C1842D"/>
      <stop offset=".5" stop-color="#F5D88A"/>
      <stop offset="1" stop-color="#C1842D"/>
    </linearGradient>
    <filter id="shadow-light-portrait" x="-30%" y="-30%" width="160%" height="160%">
