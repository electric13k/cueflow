    <rect x="400" y="650" width="120" height="520" rx="14" fill="#FFF9EF" opacity=".84" filter="url(#shadow-light-portrait)"/>
    <rect x="560" y="900" width="110" height="320" rx="14" fill="#7D3434" opacity=".72" filter="url(#shadow-light-portrait)"/>
    <rect x="210" y="1300" width="480" height="48" rx="28" fill="#C1842D"/>
    <path d="M190 1460 C300 1360 380 1500 460 1410 S620 1300 720 1400" fill="none" stroke="#D8CBB8" stroke-width="9" opacity=".7"/>
    <circle cx="690" cy="220" r="74" fill="#F5D88A" opacity=".22" filter="url(#soft-light-portrait)"/>
  
